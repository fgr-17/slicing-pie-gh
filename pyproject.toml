[project]
name = "slicingpie"
version = "0.1.0"
description = "Compute the Slicing Pie (hours) from Done tickets on a GitHub Project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
slicingpie = "slicingpie:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "complexipy>=3",
    "pylint>=3",
    "pytest>=8.0",
    "pytest-cov>=5",
    "radon>=6",
    "vulture>=2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["slicingpie"]
branch = true
omit = ["*/slicingpie/sast.py", "*/slicingpie/sast_gates.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = ["*/slicingpie/sast.py", "*/slicingpie/sast_gates.py"]
