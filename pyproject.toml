[project]
name = "slicingpie"
version = "0.1.0"
description = "Calcula el Slicing Pie (horas) desde tickets Done de un GitHub Project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
slicingpie = "slicingpie:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
