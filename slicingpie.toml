# Local Slicing Pie config.
# Copy slicingpie.toml.example and fill in GitHub when you want real data.
# You can also use slicingpie.local.toml (it wins and is not versioned).
# Model multipliers: mike-moyer-model.toml

mode = "demo"

[github]
token = ""
owner = "my-org"
owner_type = "auto"
project_number = 1

[fields]
status = "Status"
done = ["Done", "Listo", "Completado"]
estimate = "Estimate"

[slicing_pie]
default_hourly_rate = 50.0
# Estimate unit on the Project field, converted to hours for Slicing Pie:
#   hours        -> x1
#   days         -> x hours_per_day (e.g. 8, or 2 if you define half-days)
#   story_points -> x days_per_story_point x hours_per_day
effort_unit = "hours"
hours_per_day = 8.0
days_per_story_point = 1.0
# Hours credited to APPROVED PR reviewers (% of ticket estimate). 0 disables.
review_percent = 0.0
split_among_assignees = true

# seniority multiplies rate. name is the display name.
[[users]]
login = "ana"
name = "Ana"
rate = 75
seniority = 1

[[users]]
login = "carlos"
name = "Carlos"
rate = 50
seniority = 1

[[users]]
login = "maria"
name = "Maria"
rate = 65
seniority = 1

[display]
currency_symbol = "$"
language = "es"

[expenses]
label = "[expensa]"
currency = "USD"
