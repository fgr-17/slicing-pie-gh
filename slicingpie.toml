# Local Slicing Pie config.
# Copy slicingpie.toml.example and fill in GitHub when you want real data.
# You can also use slicingpie.local.toml (it wins and is not versioned).

mode = "demo"

[github]
token = ""
owner = "my-org"
owner_type = "auto"
project_number = 1

[fields]
status = "Status"
done = ["Done", "Listo", "Completado"]
estimate = "Estimate"

[slicing_pie]
time_multiplier = 2.0
default_hourly_rate = 50.0
hours_per_estimate_unit = 1.0
split_among_assignees = true

# seniority multiplies rate. name is the display name.
[[users]]
login = "ana"
name = "Ana"
rate = 75
seniority = 1

[[users]]
login = "carlos"
name = "Carlos"
rate = 50
seniority = 1

[[users]]
login = "maria"
name = "Maria"
rate = 65
seniority = 1

[display]
currency_symbol = "$"
language = "es"
